---
name: Labeler
# pull_request_target so that pull requests from forks get a token allowed to
# set labels. Safe here: the job never checks out or runs pull request code,
# and labeler reads .github/labeler.yml from the base branch.
on: # yamllint disable-line
  - pull_request_target

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          sync-labels: true
