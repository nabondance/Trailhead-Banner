---
name: Banner Preview Publish

# Second half of the banner preview: uploads the banners generated by
# banner-preview.yml to Vercel Blob and posts the pull request comment.
#
# `workflow_run` always runs the workflow and scripts of the default branch,
# with secrets and a write token, even when the pull request comes from a fork
# (where the `pull_request` run gets neither). Pull request code is never
# checked out or executed here: only its artifact is read, as untrusted data.
on: # yamllint disable-line rule:truthy
  workflow_run:
    workflows: [Banner Preview]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Banner Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (
        github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure'
      )

    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      # Default branch, not the pull request head
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Missing when the preview run failed before generating banners
      - name: Download banners
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: banner-preview
          path: ${{ runner.temp }}/banner-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        if: steps.download.outcome == 'success'
        run: pnpm install

      - name: Upload banners and post PR comment
        if: steps.download.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ARTIFACT_DIR: ${{ runner.temp }}/banner-preview
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: node .github/scripts/banner-preview/publish.mjs
