---
name: Lighthouse Comment

# Posts the Lighthouse scores as a pull request comment.
#
# `workflow_run` always runs the workflow and scripts of the default branch,
# with a write token, even when the pull request comes from a fork (where the
# `pull_request` run of lighthouse.yml only gets a read-only token). Pull
# request code is never checked out or executed here: only the manifest from
# its artifact is read, as untrusted data.
on: # yamllint disable-line rule:truthy
  workflow_run:
    workflows: [Lighthouse]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post Lighthouse Comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (
        github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure'
      )

    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      # Default branch, not the pull request head
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Missing when the Lighthouse run failed before producing results
      - name: Download Lighthouse manifest
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: lighthouse-manifest
          path: ${{ runner.temp }}/lighthouse
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Also runs without the artifact, to replace scores from an earlier commit
      - name: Post PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_DIR: ${{ runner.temp }}/lighthouse
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: node .github/scripts/lighthouse/post-comment.mjs
