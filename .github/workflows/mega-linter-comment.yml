---
name: MegaLinter Comment

# Posts the MegaLinter report as a pull request comment.
#
# `workflow_run` always runs the workflow and scripts of the default branch,
# with a write token, even when the pull request comes from a fork (where the
# `pull_request` run of mega-linter.yml only gets a read-only token). Pull
# request code is never checked out or executed here: only the report from its
# artifact is read, as untrusted text.
on: # yamllint disable-line rule:truthy
  workflow_run:
    workflows: [MegaLinter]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post MegaLinter Comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (
        github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure'
      )

    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      # Default branch, not the pull request head
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Missing when the MegaLinter run failed before linting
      - name: Download MegaLinter reports
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: MegaLinter reports
          path: ${{ runner.temp }}/megalinter
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post PR comment
        if: steps.download.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_DIR: ${{ runner.temp }}/megalinter
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: node .github/scripts/mega-linter/post-comment.mjs
