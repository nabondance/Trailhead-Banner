---
name: Lighthouse

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.mjs'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Runs against a local production build (`next start`): Vercel previews sit behind
    # SSO protection. No secrets needed: the generation counters fall back to null.
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.js', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      # Assertions are warnings for now: the job reports scores without blocking PRs
      - name: Run Lighthouse CI
        run: npx -y @lhci/cli@0.16.1 autorun

      - name: Write job summary
        if: always()
        run: |
          manifest=.lighthouseci/reports/manifest.json
          [ -f "$manifest" ] || { echo "No Lighthouse results" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "### Lighthouse (mobile, median of 3 runs)"
            echo ""
            echo "| Page | Performance | Accessibility | Best practices | SEO |"
            echo "|---|---|---|---|---|"
            jq -r '.[] | select(.isRepresentativeRun) | .summary as $s
              | "| \(.url | sub("http://localhost:3000"; "")) | \([$s.performance, $s.accessibility, $s["best-practices"], $s.seo] | map(. * 100 | round | tostring) | join(" | ")) |"' "$manifest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
          retention-days: 14
